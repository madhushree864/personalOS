version: '3.9'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql+psycopg2://personalos:${POSTGRES_PASSWORD}@db:5432/personalos
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in your environment}
      SEED_DEMO_DATA: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-personalos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: personalos
    volumes:
      - personalos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-personalos} -d personalos"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:4000
    depends_on:
      - backend

volumes:
  personalos-postgres:
